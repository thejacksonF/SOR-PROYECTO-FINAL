<VirtualHost *:80>
    ServerName www.gidn-equipo1.local
    ServerAlias gidn-equipo1.local portal.gidn-equipo1.local
    Redirect permanent / https://www.gidn-equipo1.local/
</VirtualHost>

<VirtualHost *:443>
    ServerName www.gidn-equipo1.local
    ServerAlias gidn-equipo1.local portal.gidn-equipo1.local
    DocumentRoot /var/www/gidn-portal

    SSLEngine on
    SSLCertificateFile /etc/pki/tls/certs/gidn.crt
    SSLCertificateKeyFile /etc/pki/tls/private/gidn.key

    <Directory /var/www/gidn-portal>
        Require all granted
    </Directory>

    ErrorLog logs/gidn-portal_error.log
    CustomLog logs/gidn-portal_access.log combined
</VirtualHost>
